[project]
name = "stats"
version = "0.1.0"
description = "Pipeline de datos deportivos: ingesta, modelado con dbt y una app de resultados"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb==1.1.3",
  "dbt-core==1.9.1",
  "dbt-duckdb==1.9.1",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
