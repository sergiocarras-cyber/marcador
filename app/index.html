<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<title>Marcador</title>
<style>
  :root {
    --bg: #ffffff; --soft: #f5f5f6; --line: #ececee; --text: #111113; --muted: #8a8a90; --faint: #b8b8bd; --live: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0c; --soft: #17171a; --line: #222226; --text: #f4f4f5; --muted: #8b8b92; --faint: #55555c; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }
  .wrap { max-width: 520px; margin: 0 auto; padding: env(safe-area-inset-top) max(20px, env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 22px 0 12px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .eyebrow { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
  .links { display: flex; gap: 16px; }
  .link { font-size: 14px; color: var(--muted); }
  .link.on { color: var(--text); font-weight: 600; }

  .days { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .days button { width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted); }
  .days button:disabled { opacity: .3; cursor: default; }
  .days button svg { width: 18px; height: 18px; }
  .day-label { text-align: center; font-size: 14px; }
  .day-label b { font-weight: 600; }
  .day-label span { color: var(--muted); }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg);
    border-top: 1px solid var(--line); padding: 0 12px env(safe-area-inset-bottom); }
  nav.tabs .in { max-width: 520px; margin: 0 auto; display: flex; }
  nav.tabs button { flex: 1; padding: 16px 0 14px; font-size: 13px; color: var(--muted); position: relative; }
  nav.tabs button.sel { color: var(--text); font-weight: 600; }
  nav.tabs button.sel::before { content: ""; position: absolute; top: -1px; left: 30%; right: 30%; height: 2px; background: var(--text); }

  .section { font-size: 12px; color: var(--muted); margin: 28px 0 4px; }
  .section:first-child { margin-top: 8px; }

  .game { padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row { display: flex; align-items: center; gap: 12px; padding: 3px 0; }
  .logo { width: 22px; height: 22px; object-fit: contain; flex: none; }
  .name { flex: 1; min-width: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rec { color: var(--faint); font-size: 12px; margin-left: 6px; }
  .score { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; }
  .lost .name, .lost .score { color: var(--muted); font-weight: 400; }
  .meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; padding-left: 34px; }
  .live-txt { color: var(--live); font-weight: 600; }
  .masked { color: var(--faint); letter-spacing: 2px; }
  .followed { font-size: 11px; color: var(--muted); margin-left: 6px; }

  .details { display: none; padding: 14px 0 4px 34px; font-size: 14px; }
  .game.open .details { display: block; }
  .headline { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin-top: 3px; }
  .qs-wrap { overflow-x: auto; margin-top: 14px; }
  table.qs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  table.qs th { color: var(--faint); font-weight: 400; text-align: center; padding: 0 4px 4px; }
  table.qs td { text-align: center; padding: 2px 4px; color: var(--muted); }
  table.qs td:first-child, table.qs th:first-child { text-align: left; color: var(--text); }
  table.qs td:last-child { color: var(--text); font-weight: 600; }
  .actions { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; }
  .actions button, .actions a { color: var(--muted); text-decoration: none; }
  .actions .on { color: var(--text); font-weight: 600; }

  .story { padding: 22px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .story:first-child { padding-top: 6px; }
  .story-team { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .story-team img { width: 18px; height: 18px; object-fit: contain; }
  .story h2 { font-size: 21px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; margin: 10px 0 6px; text-wrap: balance; }
  .story p { margin: 0; color: var(--muted); }
  .scoreline { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .scoreline img { width: 18px; height: 18px; object-fit: contain; }
  .scoreline b { font-weight: 600; }
  .scoreline .sep { color: var(--faint); }
  .small { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .small b { color: var(--text); font-weight: 500; }
  .form { display: inline-flex; gap: 3px; vertical-align: -3px; margin-left: 4px; }
  .form i { font-style: normal; width: 16px; height: 16px; border-radius: 3px; font-size: 10px; font-weight: 600;
    display: grid; place-items: center; background: var(--soft); color: var(--muted); }
  .form i.W { background: var(--text); color: var(--bg); }

  .gp h2 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; margin: 6px 0 2px; }
  .gp .sub { color: var(--muted); font-size: 13px; }
  .podium { margin: 18px 0 8px; }
  .podium .p { display: flex; align-items: baseline; gap: 14px; padding: 6px 0; font-size: 16px; }
  .podium .p span { color: var(--muted); width: 18px; font-variant-numeric: tabular-nums; }
  .podium .p small { color: var(--muted); margin-left: auto; font-size: 12px; }
  .session { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .session span:last-child { color: var(--muted); text-align: right; }

  .seg { display: flex; gap: 20px; margin-top: 16px; font-size: 14px; overflow-x: auto; }
  .seg button { color: var(--muted); padding-bottom: 6px; white-space: nowrap; border-bottom: 2px solid transparent; }
  .seg button.sel { color: var(--text); font-weight: 600; border-color: var(--text); }
  .seg.small-seg { gap: 14px; font-size: 13px; margin-top: 10px; }
  .search { width: 100%; margin-top: 14px; padding: 10px 12px; border-radius: 10px; border: 0; background: var(--soft);
    color: var(--text); font: inherit; outline: none; }
  .pick { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .pick img { width: 24px; height: 24px; object-fit: contain; }
  .pick .name { font-size: 15px; }
  .pick button { font-size: 13px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--text); }
  .pick button.on { background: var(--text); border-color: var(--text); color: var(--bg); }

  .empty { color: var(--muted); padding: 56px 0; text-align: center; }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
  .btn { display: inline-block; margin-top: 18px; padding: 10px 20px; border-radius: 999px; background: var(--text); color: var(--bg); font-weight: 600; }
  .skeleton { height: 14px; border-radius: 4px; background: var(--soft); margin: 22px 0 10px; }
  .skeleton.w2 { width: 70%; height: 20px; } .skeleton.w3 { width: 45%; margin-top: 0; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header id="header"></header>
  <main id="main"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>

<script>
// La app solo lee la API estática que publica el pipeline (serving/export.py): nada de llamadas a terceros.
const DATA = 'data';

const SPORTS = {
  futbol: { label: 'Fútbol', tz: 'Europe/Madrid', reg: 2 },
  nba: { label: 'NBA', tz: 'America/New_York', reg: 4 },
  nfl: { label: 'NFL', tz: 'America/New_York', reg: 4 },
  f1:  { label: 'F1', f1: true },
  mlb: { label: 'MLB', tz: 'America/New_York', reg: 9 },
};
const PICK_LEAGUES = [['esp.1', 'LaLiga'], ['eng.1', 'Premier'], ['ita.1', 'Serie A'], ['ger.1', 'Bundesliga'], ['fra.1', 'Ligue 1'], ['esp.2', 'Segunda']];
const OUTCOME_ES = { W: 'G', D: 'E', L: 'P' };

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let view = store.get('view', 'home');
if (view !== 'home' && !SPORTS[view]) view = 'home';
// Formato anterior {sport,id,...} → clave "deporte-id"
let favTeams = store.get('favTeams', []).map(f => ({ ...f, key: f.key || `${f.sport}-${f.id}` }));
let spoilerFree = store.get('spoilerFree', false);
let revealed = new Set();
let current = null, openId = null, reqId = 0, meta = null;
let pickSport = 'futbol', pickLeague = 'esp.1', pickQuery = '';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const CHEV_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const CHEV_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';

const cache = new Map();
async function getJSON(path) {
  if (cache.has(path)) return cache.get(path);
  const p = fetch(`${DATA}/${path}`, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null);
  cache.set(path, p);
  p.catch(() => cache.delete(path));
  return p;
}

// ---------- Fechas ----------
function partsIn(tz, d = new Date()) {
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' });
  const o = Object.fromEntries(f.formatToParts(d).map(p => [p.type, p.value]));
  return { date: `${o.year}-${o.month}-${o.day}`, hour: +o.hour };
}
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function preferredDay(s) {
  const { date, hour } = partsIn(s.tz);
  return hour < (s.tz === 'Europe/Madrid' ? 13 : 12) ? addDays(date, -1) : date;
}
function dayName(iso, s) {
  const today = partsIn(s.tz).date;
  const diff = Math.round((new Date(iso) - new Date(today)) / 86400000);
  if (diff === 0) return 'Hoy';
  if (diff === -1) return s.tz === 'Europe/Madrid' ? 'Ayer' : 'Anoche';
  if (diff === 1) return 'Mañana';
  return cap(new Date(iso + 'T12:00:00Z').toLocaleDateString('es-ES', { weekday: 'long', timeZone: 'UTC' }));
}
const longDate = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('es-ES', { day: 'numeric', month: 'long', timeZone: 'UTC' });
const hhmm = d => new Date(d).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
const shortDate = d => new Date(d).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, '');
function ago(iso) {
  if (!iso) return '';
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'actualizado ahora';
  if (min < 60) return `actualizado hace ${min} min`;
  if (min < 48 * 60) return `actualizado hace ${Math.round(min / 60)} h`;
  return `actualizado el ${shortDate(iso)}`;
}

// ---------- Estado del partido ----------
function liveText(g) {
  const p = g.period, n = g.status;
  if (n === 'STATUS_HALFTIME') return 'Descanso';
  if (g.sport === 'futbol') return g.clock || `${p}ª parte`;
  if (g.sport === 'mlb') return `${p}ª entrada`;
  const q = p <= 4 ? `${p}º cuarto` : (p === 5 ? 'Prórroga' : `${p - 4}ª prórroga`);
  return n === 'STATUS_END_PERIOD' ? `Fin ${q}` : `${q} · ${g.clock}`;
}
function extraTime(g) {
  if (g.sport === 'futbol') return g.penalties ? ' · penaltis' : g.extra_time ? ' · prórroga' : '';
  if (g.sport === 'mlb') return g.extra_time ? ` · ${g.period} entradas` : '';
  return g.extra_time ? (g.period === 5 ? ' · prórroga' : ` · ${g.period - 4} prórrogas`) : '';
}
const isPostponed = g => g.status === 'STATUS_POSTPONED' || g.status === 'STATUS_CANCELED';
const isFollowed = key => favTeams.some(f => f.key === key);
const gameFollowed = g => isFollowed(g.home.key) || isFollowed(g.away.key);
function toggleFollow(sport, t) {
  if (isFollowed(t.key)) favTeams = favTeams.filter(f => f.key !== t.key);
  else favTeams.push({ key: t.key, sport, name: t.name, logo: t.logo });
  store.set('favTeams', favTeams);
}

// ---------- Navegación ----------
function go(v, opts = {}) {
  view = v; if (v !== 'picker') store.set('view', v);
  current = opts.date || null; openId = opts.open || null;
  window.scrollTo(0, 0);
  drawTabs(); render();
}
function drawTabs() {
  const items = [['home', 'Inicio'], ...Object.entries(SPORTS).map(([k, s]) => [k, s.label])];
  $('tabs').innerHTML = items.map(([k, l]) => `<button data-v="${k}" class="${k === view ? 'sel' : ''}">${l}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { if (b.dataset.v !== view) go(b.dataset.v); });
}
function render() {
  if (view === 'home') return renderHome();
  if (view === 'picker') return renderPicker();
  return SPORTS[view].f1 ? renderF1() : renderSport();
}
const spoilerLink = () => `<button class="link ${spoilerFree ? 'on' : ''}" id="spoilerBtn">${spoilerFree ? 'Marcadores ocultos' : 'Ocultar'}</button>`;
function bindSpoiler() {
  const b = $('spoilerBtn'); if (!b) return;
  b.onclick = () => { spoilerFree = !spoilerFree; store.set('spoilerFree', spoilerFree); revealed.clear(); render(); };
}
function offline(msg = 'No se pudieron cargar los datos.') {
  $('main').innerHTML = `<div class="empty"><b>Sin conexión</b>${msg}<br><button class="btn" id="retry">Reintentar</button></div>`;
  $('retry').onclick = () => { cache.clear(); render(); };
}

// ---------- Inicio ----------
async function renderHome() {
  const id = ++reqId;
  const today = cap(new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }));
  $('header').innerHTML = `<div class="eyebrow">${today}${meta ? ' · ' + ago(meta.data_as_of) : ''}</div>
    <div class="top"><h1>Tus equipos</h1><div class="links">${spoilerLink()}<button class="link" id="editBtn">Editar</button></div></div>`;
  bindSpoiler();
  $('editBtn').onclick = () => go('picker');
  const main = $('main');
  if (!favTeams.length) {
    main.innerHTML = `<div class="empty"><b>Aún no sigues a ningún equipo</b>Elige tus equipos y aquí verás cada mañana cómo les fue.<br><button class="btn" id="startBtn">Elegir equipos</button></div>`;
    $('startBtn').onclick = () => go('picker');
    return;
  }
  main.innerHTML = favTeams.map(() => '<div class="skeleton w3"></div><div class="skeleton w2"></div><div class="skeleton"></div>').join('');
  const docs = await Promise.all(favTeams.map(f => getJSON(`team/${f.key}.json`).then(d => ({ fav: f, d })).catch(() => ({ fav: f, d: null }))));
  if (id !== reqId) return;
  const latest = x => x.d?.live ? Infinity : new Date(x.d?.last?.start_time || 0).getTime();
  docs.sort((a, b) => latest(b) - latest(a));
  main.innerHTML = '';
  docs.forEach(x => main.appendChild(storyCard(x)));
}

function formChips(form) {
  if (!form?.last_5) return '';
  return `<span class="form" aria-label="Últimos resultados">${[...form.last_5].map(o => `<i class="${o}">${OUTCOME_ES[o]}</i>`).join('')}</span>`;
}

function storyCard({ fav, d }) {
  const el = document.createElement('div');
  el.className = 'story';
  const sport = fav.sport;
  const head = `<div class="story-team"><img src="${esc(fav.logo)}" alt="">${esc(fav.name)} · ${SPORTS[sport].label}</div>`;
  const game = d?.live || d?.last;
  if (!d || !game) {
    el.innerHTML = head + `<p style="margin-top:10px">${d ? 'Todavía no ha jugado esta temporada.' : 'No hay datos de este equipo.'}</p>` + nextLine(d);
    return el;
  }
  const hide = spoilerFree && !revealed.has(game.id);
  const live = game.state === 'in';
  const [l, r] = sport === 'futbol' ? [game.home, game.away] : [game.away, game.home];
  const score = hide ? '<span class="masked">· ·</span>' : `<b>${l.score ?? ''}</b><span class="sep">–</span><b>${r.score ?? ''}</b>`;
  const status = live ? `<span class="live-txt">En juego · ${esc(liveText(game))}</span>`
    : [`Final${extraTime(game)}`, shortDate(game.start_time), sport === 'futbol' ? game.league : ''].filter(Boolean).join(' · ');
  const h = game.headline;
  const titleHtml = hide ? `<h2>Resultado oculto</h2><p>Toca para verlo.</p>`
    : live ? `<h2>${esc(game.home.name)} ${game.home.score} – ${game.away.score} ${esc(game.away.name)}</h2>`
    : h ? `<h2>${esc(h.title)}</h2>${h.text ? `<p>${esc(h.text)}</p>` : ''}` : '';
  const standing = d.standing?.position ? `${d.standing.position}º en ${esc(d.standing.league || '')}${d.standing.points != null && sport === 'futbol' ? ` · ${d.standing.points} pts` : ''}` : '';
  const form = hide ? '' : [standing, d.form?.last_5 ? `Forma ${formChips(d.form)}` : ''].filter(Boolean).join(' · ');
  el.innerHTML = head + titleHtml +
    `<div class="scoreline"><img src="${esc(l.logo)}" alt="">${esc(l.name)} ${score} ${esc(r.name)}<img src="${esc(r.logo)}" alt=""></div>
     <div class="small">${status}</div>` + (form ? `<div class="small">${form}</div>` : '') + nextLine(d);
  el.onclick = () => {
    if (hide) { revealed.add(game.id); el.replaceWith(storyCard({ fav, d })); return; }
    go(sport, { date: game.date, open: game.id });
  };
  return el;
}
function nextLine(d) {
  const n = d?.next;
  if (!n) return '';
  const home = n.home.key === d.team.key;
  const opp = home ? n.away : n.home;
  return `<div class="small">Próximo: <b>${home ? 'contra' : 'en casa de'} ${esc(opp.name)}</b> · ${shortDate(n.start_time)}, ${hhmm(n.start_time)}</div>`;
}

// ---------- Selector de equipos ----------
async function renderPicker() {
  const id = ++reqId;
  $('header').innerHTML = `<div class="top"><h1>Equipos</h1><button class="link on" id="doneBtn">Listo</button></div>
    <div class="seg" id="segSport">${['futbol', 'nba', 'nfl', 'mlb'].map(k =>
      `<button data-k="${k}" class="${k === pickSport ? 'sel' : ''}">${SPORTS[k].label}</button>`).join('')}</div>
    ${pickSport === 'futbol' ? `<div class="seg small-seg" id="segLeague">${PICK_LEAGUES.map(([k, l]) =>
      `<button data-k="${k}" class="${k === pickLeague ? 'sel' : ''}">${l}</button>`).join('')}</div>` : ''}
    <input class="search" id="search" placeholder="Buscar equipo" value="${esc(pickQuery)}" autocomplete="off">`;
  $('doneBtn').onclick = () => go('home');
  $('segSport').querySelectorAll('button').forEach(b => b.onclick = () => { pickSport = b.dataset.k; pickQuery = ''; renderPicker(); });
  $('segLeague')?.querySelectorAll('button').forEach(b => b.onclick = () => { pickLeague = b.dataset.k; renderPicker(); });
  $('search').oninput = ev => { pickQuery = ev.target.value; drawList(); };

  const main = $('main');
  main.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  let all;
  try { all = await getJSON(`teams/${pickSport}.json`); } catch { all = null; }
  if (id !== reqId) return;
  if (!all) return offline('No se pudo cargar la lista de equipos.');
  drawList();

  function drawList() {
    const q = pickQuery.trim().toLowerCase();
    // Al buscar se busca en todas las ligas; sin búsqueda, solo en la liga elegida
    const teams = all.filter(t => q ? (t.full.toLowerCase().includes(q) || t.name.toLowerCase().includes(q))
                                    : (pickSport !== 'futbol' || t.league_key === pickLeague));
    main.innerHTML = '';
    for (const t of teams) {
      const row = document.createElement('div');
      row.className = 'pick';
      const draw = () => {
        const on = isFollowed(t.key);
        row.innerHTML = `<img src="${esc(t.logo)}" alt="" loading="lazy"><div class="name">${esc(t.full)}</div>
          <button class="${on ? 'on' : ''}">${on ? 'Siguiendo' : 'Seguir'}</button>`;
        row.querySelector('button').onclick = () => { toggleFollow(pickSport, t); draw(); };
      };
      draw();
      main.appendChild(row);
    }
    if (!teams.length) main.innerHTML = '<div class="empty">Ningún equipo coincide.</div>';
  }
}

// ---------- Vista por deporte ----------
async function renderSport() {
  const sport = view, s = SPORTS[sport];
  const id = ++reqId;
  let days;
  try { days = await getJSON(`days/${sport}/index.json`); } catch { days = null; }
  if (id !== reqId) return;
  if (!days) { drawSportHeader(sport, null, []); return offline(); }
  if (!days.length) { drawSportHeader(sport, null, days); $('main').innerHTML = `<div class="empty"><b>Sin partidos</b></div>`; return; }

  // Día por defecto: el preferido si hubo partidos; si no, el último día con partidos antes de él
  if (!current) {
    const pref = preferredDay(s);
    current = days.includes(pref) ? pref : ([...days].reverse().find(d => d <= pref) || days[0]);
  }
  drawSportHeader(sport, current, days);
  const main = $('main');
  if (main.dataset.key !== sport + current) main.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  main.dataset.key = sport + current;
  let doc;
  try { doc = await getJSON(`days/${sport}/${current}.json`); } catch { doc = null; }
  if (id !== reqId) return;
  if (!doc) return offline();
  renderDay(doc, sport);
}

function drawSportHeader(sport, day, days) {
  const s = SPORTS[sport];
  const i = day ? days.indexOf(day) : -1;
  $('header').innerHTML = `<div class="top"><h1>${s.label}</h1>${spoilerLink()}</div>` + (day ? `
    <div class="days"><button id="prev" aria-label="Día anterior con partidos" ${i <= 0 ? 'disabled' : ''}>${CHEV_L}</button>
    <div class="day-label"><b>${dayName(day, s)}</b> <span>· ${longDate(day)}</span></div>
    <button id="next" aria-label="Día siguiente con partidos" ${i >= days.length - 1 ? 'disabled' : ''}>${CHEV_R}</button></div>` : '');
  bindSpoiler();
  if (!day) return;
  // Las flechas saltan entre días con partidos, nunca a días vacíos
  $('prev').onclick = () => { if (i > 0) { current = days[i - 1]; openId = null; renderSport(); } };
  $('next').onclick = () => { if (i < days.length - 1) { current = days[i + 1]; openId = null; renderSport(); } };
}

function renderDay(doc, sport) {
  const main = $('main');
  const openIds = new Set([...main.querySelectorAll('.game.open')].map(g => g.dataset.id));
  if (openId) openIds.add(openId);
  main.innerHTML = '';
  const order = { in: 0, post: 1, pre: 2 };
  const sortFn = (a, b) => gameFollowed(b) - gameFollowed(a) || order[a.state] - order[b.state] || a.start_time.localeCompare(b.start_time);
  const multi = doc.groups.length > 1;
  const all = doc.groups.flatMap(g => g.games);
  const mine = multi ? all.filter(gameFollowed).sort(sortFn) : [];
  if (mine.length) {
    main.insertAdjacentHTML('beforeend', `<div class="section">Tus equipos</div>`);
    mine.forEach(g => main.appendChild(card(g, openIds.has(g.id))));
  }
  for (const grp of doc.groups) {
    const gs = grp.games.filter(g => !multi || !gameFollowed(g)).sort(sortFn);
    if (!gs.length) continue;
    if (multi || sport === 'futbol') main.insertAdjacentHTML('beforeend', `<div class="section">${esc(grp.league)}</div>`);
    gs.forEach(g => main.appendChild(card(g, openIds.has(g.id))));
  }
  const open = main.querySelector('.game.open');
  if (openId && open) { open.scrollIntoView({ block: 'center' }); openId = null; }
}

function card(g, open) {
  const sport = g.sport;
  const [first, second] = sport === 'futbol' ? [g.home, g.away] : [g.away, g.home];
  const hide = spoilerFree && g.state !== 'pre' && !revealed.has(g.id);
  const el = document.createElement('div');
  el.className = 'game' + (open && !hide ? ' open' : '');
  el.dataset.id = g.id;
  const decided = g.state === 'post' && !hide && g.result && g.result !== 'draw';
  const row = t => {
    const won = (g.result === 'home' && t === g.home) || (g.result === 'away' && t === g.away);
    const score = g.state === 'pre' || isPostponed(g) ? '' : hide ? '<span class="masked">·</span>' : (t.score ?? '');
    return `<div class="row ${decided && !won ? 'lost' : ''}"><img class="logo" src="${esc(t.logo)}" alt="" loading="lazy">
      <div class="name">${esc(t.name)}${t.record ? `<span class="rec">${esc(t.record)}</span>` : ''}${isFollowed(t.key) ? '<span class="followed">Siguiendo</span>' : ''}</div>
      <div class="score">${score}</div></div>`;
  };
  let left, right = '';
  if (isPostponed(g)) left = 'Aplazado';
  else if (g.state === 'in') left = `<span class="live-txt">${hide ? 'En juego' : esc(liveText(g))}</span>`;
  else if (g.state === 'post') { left = `Final${hide ? '' : extraTime(g)}`; right = hide ? 'Toca para ver' : ''; }
  else { left = hhmm(g.start_time); right = esc(g.broadcast || ''); }
  if (g.preseason) right = right ? right + ' · Pretemporada' : 'Pretemporada';
  el.innerHTML = row(first) + row(second) + `<div class="meta"><span>${left}</span><span>${right}</span></div>` +
    (hide ? '' : `<div class="details">${details(g, first, second)}</div>`);
  el.onclick = ev => {
    const fb = ev.target.closest('[data-fav]');
    if (fb) { toggleFollow(sport, [first, second].find(x => x.key === fb.dataset.fav)); el.replaceWith(card(g, true)); return; }
    if (ev.target.closest('a')) return;
    if (hide) { revealed.add(g.id); el.replaceWith(card(g, false)); return; }
    el.classList.toggle('open');
  };
  return el;
}

function details(g, first, second) {
  let html = '';
  if (g.headline) html += `<div class="headline">${esc(g.headline.title)}</div>${g.headline.text ? `<div class="lede">${esc(g.headline.text)}</div>` : ''}`;
  else if (g.state === 'pre') html += `<div class="lede">${cap(shortDate(g.start_time))}, ${hhmm(g.start_time)}${g.venue ? ' · ' + esc(g.venue) : ''}</div>`;
  else if (g.state === 'in' && g.goals?.length) html += `<div class="lede">${g.goals.map(x => `${esc(x.player)} ${esc(x.minute)}`).join(' · ')}</div>`;

  if (g.sport !== 'futbol' && first.linescores.length) {
    const reg = SPORTS[g.sport].reg, n = Math.max(first.linescores.length, second.linescores.length);
    const heads = Array.from({ length: n }, (_, i) => g.sport === 'mlb' ? i + 1 : i < reg ? i + 1 : `P${i - reg + 1}`);
    html += `<div class="qs-wrap"><table class="qs"><tr><th></th>${heads.map(x => `<th>${x}</th>`).join('')}<th>T</th></tr>
      ${[first, second].map(t => `<tr><td>${esc(t.abbr)}</td>${t.linescores.map(v => `<td>${v}</td>`).join('')}<td>${t.score ?? ''}</td></tr>`).join('')}</table></div>`;
  }
  html += `<div class="actions">${[first, second].map(t => {
      const on = isFollowed(t.key);
      return `<button data-fav="${esc(t.key)}" class="${on ? 'on' : ''}">${on ? 'Siguiendo' : 'Seguir'} a ${esc(t.name)}</button>`; }).join('')}
    ${g.link ? `<a href="${esc(g.link)}" target="_blank" rel="noopener">Ficha completa</a>` : ''}</div>`;
  return html;
}

// ---------- F1 ----------
async function renderF1() {
  const id = ++reqId;
  $('header').innerHTML = `<div class="top"><h1>Fórmula 1</h1>${spoilerLink()}</div>`;
  bindSpoiler();
  const main = $('main');
  main.innerHTML = '<div class="skeleton w2"></div><div class="skeleton"></div><div class="skeleton"></div>';
  let data;
  try { data = await getJSON('f1.json'); } catch { data = null; }
  if (id !== reqId) return;
  if (!data) return offline();
  const gpHtml = (gp, label) => {
    const race = gp.sessions.find(s => s.label === 'Carrera') || gp.sessions[gp.sessions.length - 1];
    const hide = spoilerFree && !revealed.has(gp.id);
    const range = `${new Date(gp.start).getDate()}–${new Date(gp.end).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' })}`;
    let podium = '';
    if (race.state === 'post' && race.top3.length) {
      podium = hide ? `<div class="podium" style="color:var(--muted);cursor:pointer" data-reveal="${gp.id}">Carrera terminada. Toca para ver el podio.</div>`
        : `<div class="podium">${race.top3.map(p => `<div class="p"><span>${p.position}</span>${esc(p.driver)}<small>${esc(p.country || '')}</small></div>`).join('')}</div>`;
    }
    const sessions = gp.sessions.map(s => {
      let right;
      if (s.state === 'in') right = '<span class="live-txt">En directo</span>';
      else if (s.state === 'post') right = hide ? 'Terminada' : esc(s.top3[0]?.driver || 'Terminada');
      else right = `${shortDate(s.start)}, ${hhmm(s.start)}`;
      return `<div class="session"><span>${esc(s.label)}</span><span>${right}</span></div>`;
    }).join('');
    return `<div class="gp"><div class="section">${label}</div><h2>${esc(gp.name)}</h2>
      <div class="sub">${range}${gp.circuit ? ' · ' + esc(gp.circuit) : ''}</div>${podium}${sessions}</div>`;
  };
  main.innerHTML = (data.current ? gpHtml(data.current, 'Último Gran Premio') : '') + (data.next ? gpHtml(data.next, 'Próximo Gran Premio') : '')
    || `<div class="empty"><b>Sin Gran Premio</b>No hay carreras a la vista.</div>`;
  main.querySelectorAll('[data-reveal]').forEach(e => e.onclick = () => { revealed.add(e.dataset.reveal); renderF1(); });
}

// ---------- Gestos y arranque ----------
let tx = null, ty = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (tx === null || !SPORTS[view] || SPORTS[view].f1) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5 && !e.target.closest('.qs-wrap')) $(dx > 0 ? 'prev' : 'next')?.click();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && view !== 'picker') { cache.clear(); render(); } });

drawTabs();
getJSON('meta.json').then(m => { meta = m; if (view === 'home') renderHome(); }).catch(() => {});
render();
</script>
