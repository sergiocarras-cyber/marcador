<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)">
<title>Marcador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
  /* Diseño: tipografía condensada de marcador para cifras y titulares, cuerpo legible,
     neutros cálidos y los colores oficiales de cada equipo como único acento. */
  :root {
    --bg: #f4f4f2; --card: #ffffff; --sunken: #ececea; --line: #e3e3df;
    --ink: #111214; --muted: #6c6e74; --faint: #a6a8ad; --live: #e5484d;
    --shadow: 0 1px 2px rgba(17,18,20,.04), 0 6px 20px rgba(17,18,20,.05);
    --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0d0f; --card: #16181b; --sunken: #1d2024; --line: #25282d;
      --ink: #f2f2f3; --muted: #9a9ca3; --faint: #5d6067; --shadow: none; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--ink); font: 16px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
  img { max-width: 100%; }
  .num { font-family: var(--display); font-variant-numeric: tabular-nums; }
  .wrap { max-width: 560px; margin: 0 auto;
    padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) calc(92px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

  /* Cabecera */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 20px 0 12px; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .eyebrow { font-size: 13px; color: var(--muted); }
  h1 { font: 700 34px/1 var(--display); letter-spacing: -0.01em; margin: 4px 0 0; text-transform: uppercase; }
  .actions-top { display: flex; gap: 6px; }
  .pill { font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 999px; background: var(--card); color: var(--muted); box-shadow: var(--shadow); }
  .pill.on { background: var(--ink); color: var(--bg); }

  .days { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .days .arrow { width: 38px; height: 38px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink); flex: none; }
  .days .arrow:disabled { opacity: .35; cursor: default; }
  .days .arrow svg { width: 18px; height: 18px; }
  .day-label { flex: 1; text-align: center; }
  .day-label b { font: 600 18px var(--display); text-transform: uppercase; letter-spacing: .02em; }
  .day-label span { display: block; font-size: 13px; color: var(--muted); }

  /* Navegación inferior */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-top: 1px solid var(--line); padding: 0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left)); }
  nav.tabs .in { max-width: 560px; margin: 0 auto; display: flex; }
  nav.tabs button { flex: 1; padding: 9px 0 8px; font-size: 11px; font-weight: 500; color: var(--faint);
    display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav.tabs svg { width: 23px; height: 23px; }
  nav.tabs button.sel { color: var(--ink); }

  /* Secciones y tarjetas */
  .section { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 2px 10px; }
  .section h3 { font: 700 15px var(--display); text-transform: uppercase; letter-spacing: .06em; margin: 0; }
  .section span { font-size: 13px; color: var(--muted); }
  .card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); }
  .tag { display: inline-block; font-size: 12px; font-weight: 500; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); white-space: nowrap; }
  .chip.mine { background: var(--ink); color: var(--bg); }
  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin-right: 6px; animation: pulse 1.6s infinite; vertical-align: 1px; }
  @keyframes pulse { 50% { opacity: .35; } }
  .live-txt { color: var(--live); font-weight: 600; }

  /* Héroe con los colores de los equipos */
  .hero { position: relative; overflow: hidden; border-radius: 22px; color: #fff; cursor: pointer; box-shadow: var(--shadow);
    background: linear-gradient(115deg, var(--c1) 0%, var(--c1) 46%, var(--c2) 54%, var(--c2) 100%); }
  .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.45)); }
  .hero > * { position: relative; }
  .hero .meta-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 0; font-size: 12.5px; font-weight: 500; opacity: .92; }
  .hero .board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 18px 12px 10px; }
  .hero .side { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; }
  .crest { width: 58px; height: 58px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .crest img { width: 40px; height: 40px; object-fit: contain; }
  .hero .side b { font: 600 17px/1.15 var(--display); text-transform: uppercase; letter-spacing: .02em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hero .score { font: 700 54px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }
  .hero .score i { font-style: normal; opacity: .55; padding: 0 4px; }
  .hero .status { text-align: center; font-size: 12.5px; font-weight: 600; opacity: .92; padding-bottom: 14px; text-transform: uppercase; letter-spacing: .06em; }
  .hero .body { background: var(--card); color: var(--ink); padding: 14px 16px 16px; }
  .hero .body h2 { font: 700 22px/1.15 var(--display); margin: 0 0 6px; text-wrap: balance; }
  .hero .body p { margin: 0; color: var(--muted); font-size: 14.5px; }

  /* Resultado en lista */
  .result { padding: 16px; cursor: pointer; margin-bottom: 10px; }
  .result h2 { font: 700 20px/1.18 var(--display); margin: 8px 0 4px; text-wrap: balance; }
  .result p { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .scorebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .scorebar .t { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 500; font-size: 14.5px; }
  .scorebar .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scorebar .t.r { justify-content: flex-end; text-align: right; }
  .scorebar img { width: 24px; height: 24px; object-fit: contain; flex: none; }
  .scorebar .s { font: 700 24px var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scorebar .s i { font-style: normal; color: var(--faint); padding: 0 3px; }
  .lost { color: var(--muted); }
  .masked { color: var(--faint); letter-spacing: 3px; }

  /* Próximos: carrusel */
  .rail { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 8px; margin: 0 -2px; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .mini { flex: 0 0 230px; scroll-snap-align: start; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
  .mini .when { font: 600 15px var(--display); text-transform: uppercase; letter-spacing: .03em; }
  .mini .when small { font: 500 12px var(--body); color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 6px; }
  .mini .tm { display: flex; align-items: center; gap: 10px; font-weight: 500; }
  .mini .tm img { width: 26px; height: 26px; object-fit: contain; }
  .mini .tm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini .tm small { color: var(--faint); font-size: 12px; margin-left: auto; }

  /* Lista de partidos por deporte */
  .group { padding: 4px 0; margin-bottom: 12px; }
  .group-title { font: 600 13px var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 16px 2px; }
  .row-game { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 16px; cursor: pointer; border-top: 1px solid var(--line); }
  .group-title + .row-game { border-top: 0; }
  .row-game .teams { display: grid; gap: 6px; min-width: 0; }
  .row-game .tm { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .row-game .tm img { width: 22px; height: 22px; object-fit: contain; flex: none; }
  .row-game .tm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .row-game .tm small { color: var(--faint); font-size: 12px; }
  .row-game .tm .sc { margin-left: auto; font: 700 19px var(--display); font-variant-numeric: tabular-nums; }
  .row-game .state { grid-column: 2; grid-row: 1; align-self: center; text-align: right; font-size: 12.5px; color: var(--muted); min-width: 62px; border-left: 1px solid var(--line); padding-left: 12px; }
  .row-game .state b { display: block; color: var(--ink); font: 600 15px var(--display); }
  .followed { font-size: 11px; color: var(--muted); font-weight: 500; }

  /* Ficha de partido */
  .back { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; color: var(--muted); font-size: 15px; }
  .back svg { width: 20px; height: 20px; }
  .seg { display: flex; background: var(--sunken); border-radius: 12px; padding: 3px; margin: 16px 0 6px; }
  .seg button { flex: 1; padding: 8px 6px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button.sel { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .panel { padding: 16px; margin-top: 12px; }
  .panel h4 { font: 700 14px var(--display); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 12px; color: var(--muted); }
  .stat { margin-bottom: 14px; }
  .stat:last-child { margin-bottom: 0; }
  .stat .lbl { display: grid; grid-template-columns: 1fr auto 1fr; font-size: 14px; margin-bottom: 6px; align-items: baseline; }
  .stat .lbl b { font: 700 17px var(--display); font-variant-numeric: tabular-nums; }
  .stat .lbl b:last-child { text-align: right; }
  .stat .lbl span { color: var(--muted); text-align: center; padding: 0 8px; }
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .bar { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; display: flex; }
  .bar.l { justify-content: flex-end; }
  .bar i { display: block; height: 100%; border-radius: 3px; }
  .timeline { position: relative; }
  .tl { display: grid; grid-template-columns: 1fr 44px 1fr; align-items: center; padding: 6px 0; font-size: 14px; }
  .tl .m { text-align: center; font: 600 14px var(--display); color: var(--muted); }
  .tl .ev { display: flex; align-items: center; gap: 8px; }
  .tl .ev.r { justify-content: flex-end; text-align: right; }
  .tl .ico { width: 18px; height: 18px; flex: none; display: grid; place-items: center; }
  .tl .ico .card-y, .tl .ico .card-r { width: 10px; height: 14px; border-radius: 2px; }
  .card-y { background: #f5c518; } .card-r { background: var(--live); }
  .tl small { color: var(--muted); font-size: 12px; display: block; }
  table.box { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.box th { font: 600 12px var(--display); letter-spacing: .05em; color: var(--muted); text-align: right; padding: 0 6px 6px; }
  table.box th:first-child, table.box td:first-child { text-align: left; padding-left: 0; }
  table.box td { text-align: right; padding: 7px 6px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.box td:first-child { font-weight: 500; white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  table.box td small { color: var(--faint); font-size: 11.5px; margin-left: 4px; }
  .scroll-x { overflow-x: auto; }
  .team-head { display: flex; align-items: center; gap: 8px; font: 600 15px var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 16px 0 6px; }
  .team-head:first-of-type { margin-top: 0; }
  .team-head img { width: 22px; height: 22px; object-fit: contain; }
  .team-head small { margin-left: auto; color: var(--muted); font: 500 13px var(--body); text-transform: none; letter-spacing: 0; }
  .lineup li { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .lineup { list-style: none; margin: 0; padding: 0; }
  .lineup .jn { width: 24px; text-align: right; font: 600 14px var(--display); color: var(--muted); }
  .lineup .ps { margin-left: auto; color: var(--faint); font-size: 12px; }
  .sub-arrow { color: var(--muted); font-size: 12px; }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .vs:first-of-type { border-top: 0; }
  .vs > :last-child { text-align: right; }
  .vs .mid { text-align: center; color: var(--muted); font-size: 12.5px; }
  .form { display: inline-flex; gap: 3px; }
  .form i { font-style: normal; width: 20px; height: 20px; border-radius: 5px; font: 700 12px/20px var(--display); text-align: center; background: var(--sunken); color: var(--muted); }
  .form i.W { background: #2f9e5b; color: #fff; } .form i.L { background: var(--live); color: #fff; }
  .meetings .vs { grid-template-columns: auto 1fr auto 1fr; }
  .linescore th, .linescore td { text-align: center !important; }
  .source { text-align: center; font-size: 12px; color: var(--faint); margin: 22px 0 0; }

  /* F1 y selector */
  .gp { padding: 18px 16px; margin-bottom: 12px; }
  .gp h2 { font: 700 24px/1.1 var(--display); margin: 2px 0 4px; text-transform: uppercase; }
  .gp .sub { color: var(--muted); font-size: 14px; }
  .podium { display: grid; gap: 8px; margin: 16px 0 10px; }
  .podium .p { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--sunken); }
  .podium .p .n { font: 700 24px var(--display); width: 22px; }
  .podium .p small { margin-left: auto; color: var(--muted); font-size: 13px; }
  .podium .p.first { background: var(--ink); color: var(--bg); }
  .podium .p.first small { color: inherit; opacity: .7; }
  .session { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
  .session span:last-child { color: var(--muted); text-align: right; }
  .tabs-seg { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
  .tabs-seg button { padding: 7px 14px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .tabs-seg button.sel { background: var(--ink); color: var(--bg); }
  .search { width: 100%; margin-top: 12px; padding: 11px 14px; border-radius: 12px; border: 0; background: var(--card); box-shadow: var(--shadow); color: var(--ink); font: inherit; outline: none; }
  .pick { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .pick:first-child { border-top: 0; }
  .pick img { width: 28px; height: 28px; object-fit: contain; }
  .pick .nm { flex: 1; font-weight: 500; }
  .pick button { font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; background: var(--sunken); }
  .pick button.on { background: var(--ink); color: var(--bg); }

  .empty { color: var(--muted); padding: 50px 20px; text-align: center; }
  .empty b { display: block; color: var(--ink); font: 700 22px var(--display); text-transform: uppercase; margin-bottom: 6px; }
  .btn { display: inline-block; margin-top: 18px; padding: 11px 22px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; }
  .sk { border-radius: 18px; background: var(--card); box-shadow: var(--shadow); margin-bottom: 10px; height: 120px; position: relative; overflow: hidden; }
  .sk.tall { height: 250px; border-radius: 22px; }
  .sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--sunken), transparent); animation: sh 1.3s infinite; transform: translateX(-100%); }
  @keyframes sh { to { transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce) { .sk::after, .live-dot { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header id="header"></header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>

<script>
// La app solo lee la API estática que publica el pipeline (serving/export.py).
const DATA = 'data';

const ICONS = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>',
  futbol: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l4 2.9-1.5 4.7h-5L8 10.4z"/><path d="M12 7.5V3.2M16 10.4l4-1.4M14.5 15.1l2.4 3.6M9.5 15.1l-2.4 3.6M8 10.4L4 9"/></svg>',
  nba: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c2.8 2.6 2.8 10.2 0 12.8M18.4 5.6c-2.8 2.6-2.8 10.2 0 12.8"/></svg>',
  nfl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.5 19.5C2.8 13 6 6.2 12.5 4.5 15 3.9 17.6 4 19.5 4.5 21.2 11 18 17.8 11.5 19.5 9 20.1 6.4 20 4.5 19.5z"/><path d="M9.5 14.5l5-5M11 10.5l2.5 2.5M9.6 12l1.4 1.4M12.6 9l1.4 1.4"/></svg>',
  f1: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h13l-2.5 4L18 12H5"/><path d="M9 4v8M13 4v8M5 8h13"/></svg>',
  mlb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M7.5 4.2c1.9 2.2 2.8 5 2.6 7.8-.2 2.8-1.3 5.5-3.2 7.5M16.5 4.2c-1.9 2.2-2.8 5-2.6 7.8.2 2.8 1.3 5.5 3.2 7.5"/></svg>',
};
const CHEV_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const CHEV_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
const BALL = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l4 2.9-1.5 4.7h-5L8 10.4z" fill="currentColor"/></svg>';

const SPORTS = {
  futbol: { label: 'Fútbol', tz: 'Europe/Madrid', reg: 2 },
  nba: { label: 'NBA', tz: 'America/New_York', reg: 4 },
  nfl: { label: 'NFL', tz: 'America/New_York', reg: 4 },
  f1:  { label: 'F1', f1: true },
  mlb: { label: 'MLB', tz: 'America/New_York', reg: 9 },
};
const PICK_LEAGUES = [['esp.1', 'LaLiga'], ['eng.1', 'Premier'], ['ita.1', 'Serie A'], ['ger.1', 'Bundesliga'], ['fra.1', 'Ligue 1'], ['esp.2', 'Segunda']];
const OUTCOME_ES = { W: 'G', D: 'E', L: 'P' };

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let view = store.get('view', 'home');
if (view !== 'home' && !SPORTS[view]) view = 'home';
let favTeams = store.get('favTeams', []).map(f => ({ ...f, key: f.key || `${f.sport}-${f.id}` }));
let spoilerFree = store.get('spoilerFree', false);
let revealed = new Set();
let current = null, reqId = 0, meta = null, gameTab = null;
let pickSport = 'futbol', pickLeague = 'esp.1', pickQuery = '';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

const cache = new Map();
function getJSON(path) {
  if (cache.has(path)) return cache.get(path);
  const p = fetch(`${DATA}/${path}`, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null);
  cache.set(path, p);
  p.catch(() => cache.delete(path));
  return p;
}

// ---------- Colores de equipo ----------
function hex(c, fallback) { return c && /^[0-9a-f]{6}$/i.test(c) ? '#' + c : fallback; }
function rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function lum(h) { const [r, g, b] = rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * r + .7152 * g + .0722 * b; }
function dist(a, b) { const x = rgb(a), y = rgb(b); return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]); }
// Dos colores que se distingan y no sean casi blancos (sobre blanco no se verían)
function teamColors(home, away) {
  const pick = t => { const c = hex(t.color, '#3a3d44'); return lum(c) > .8 ? hex(t.alt_color, '#3a3d44') : c; };
  let h = pick(home), a = pick(away);
  if (dist(h, a) < 120) { const alt = hex(away.alt_color, null); a = alt && lum(alt) < .8 && dist(h, alt) >= 120 ? alt : "#3a3d44"; }
  if (dist(h, a) < 120) a = "#8a8d94";
  return [h, a];
}

// ---------- Fechas ----------
function partsIn(tz, d = new Date()) {
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' });
  const o = Object.fromEntries(f.formatToParts(d).map(p => [p.type, p.value]));
  return { date: `${o.year}-${o.month}-${o.day}`, hour: +o.hour };
}
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function preferredDay(s) { const { date, hour } = partsIn(s.tz); return hour < (s.tz === 'Europe/Madrid' ? 13 : 12) ? addDays(date, -1) : date; }
function dayName(iso, s) {
  const diff = Math.round((new Date(iso) - new Date(partsIn(s.tz).date)) / 86400000);
  if (diff === 0) return 'Hoy';
  if (diff === -1) return s.tz === 'Europe/Madrid' ? 'Ayer' : 'Anoche';
  if (diff === 1) return 'Mañana';
  return cap(new Date(iso + 'T12:00:00Z').toLocaleDateString('es-ES', { weekday: 'long', timeZone: 'UTC' }));
}
const longDate = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('es-ES', { day: 'numeric', month: 'long', timeZone: 'UTC' });
const hhmm = d => new Date(d).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
const shortDate = d => new Date(d).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, '');
function dayWord(iso) {
  const d = new Date(iso), t = new Date();
  const days = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000);
  if (days === 0) return d.getHours() < 6 ? 'Madrugada' : 'Hoy';
  if (days === 1) return d.getHours() < 6 ? 'Mañana, madrugada' : 'Mañana';
  return cap(d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric' }).replace('.', ''));
}
function ago(iso) {
  if (!iso) return '';
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'actualizado ahora';
  if (min < 60) return `actualizado hace ${min} min`;
  if (min < 48 * 60) return `actualizado hace ${Math.round(min / 60)} h`;
  return `actualizado el ${shortDate(iso)}`;
}

// ---------- Estado del partido ----------
function liveText(g) {
  const p = g.period, n = g.status;
  if (n === 'STATUS_HALFTIME') return 'Descanso';
  if (g.sport === 'futbol') return g.clock || `${p}ª parte`;
  if (g.sport === 'mlb') return `${p}ª entrada`;
  const q = p <= 4 ? `${p}º cuarto` : (p === 5 ? 'Prórroga' : `${p - 4}ª prórroga`);
  return n === 'STATUS_END_PERIOD' ? `Fin ${q}` : `${q} · ${g.clock}`;
}
function extraTime(g) {
  if (g.sport === 'futbol') return g.penalties ? ' · penaltis' : g.extra_time ? ' · prórroga' : '';
  if (g.sport === 'mlb') return g.extra_time ? ` · ${g.period} entradas` : '';
  return g.extra_time ? (g.period === 5 ? ' · prórroga' : ` · ${g.period - 4} prórrogas`) : '';
}
const isPostponed = g => g.status === 'STATUS_POSTPONED' || g.status === 'STATUS_CANCELED';
const sides = g => g.sport === 'futbol' ? [g.home, g.away] : [g.away, g.home];  // fútbol: local primero
const isWinner = (g, t) => (g.result === 'home' && t === g.home) || (g.result === 'away' && t === g.away);
const hidden = g => spoilerFree && g.state !== 'pre' && !revealed.has(g.id);
const leagueLabel = g => g.sport === 'futbol' ? g.league : SPORTS[g.sport].label;
const isFollowed = key => favTeams.some(f => f.key === key);
const gameFollowed = g => isFollowed(g.home.key) || isFollowed(g.away.key);
function toggleFollow(sport, t) {
  if (isFollowed(t.key)) favTeams = favTeams.filter(f => f.key !== t.key);
  else favTeams.push({ key: t.key, sport, name: t.name, logo: t.logo });
  store.set('favTeams', favTeams);
}
function statusText(g) {
  if (isPostponed(g)) return 'Aplazado';
  if (g.state === 'in') return liveText(g);
  if (g.state === 'post') return 'Final' + extraTime(g);
  return `${dayWord(g.start_time)} · ${hhmm(g.start_time)}`;
}

// ---------- Navegación ----------
// La ficha de partido vive en el hash (#p-<id>): el botón atrás del móvil funciona y se puede compartir.
function openGame(id) { location.hash = 'p-' + id; }
function go(v, opts = {}) {
  view = v; if (v !== 'picker') store.set('view', v);
  current = opts.date || null;
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  window.scrollTo(0, 0);
  drawTabs(); render();
}
function drawTabs() {
  const items = [['home', 'Inicio'], ...Object.entries(SPORTS).map(([k, s]) => [k, s.label])];
  const active = location.hash.startsWith('#p-') ? null : view;
  $('tabs').innerHTML = items.map(([k, l]) => `<button data-v="${k}" class="${k === active ? 'sel' : ''}" aria-label="${l}">${ICONS[k]}${l}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.v));
}
function render() {
  const h = location.hash;
  if (h.startsWith('#p-')) return renderGame(h.slice(3));
  if (view === 'home') return renderHome();
  if (view === 'picker') return renderPicker();
  return SPORTS[view].f1 ? renderF1() : renderSport();
}
window.addEventListener('hashchange', () => { gameTab = null; drawTabs(); render(); window.scrollTo(0, 0); });
const spoilerBtn = () => `<button class="pill ${spoilerFree ? 'on' : ''}" id="spoilerBtn" aria-pressed="${spoilerFree}">${spoilerFree ? 'Sin spoilers' : 'Ocultar'}</button>`;
function bindSpoiler() {
  const b = $('spoilerBtn'); if (!b) return;
  b.onclick = () => { spoilerFree = !spoilerFree; store.set('spoilerFree', spoilerFree); revealed.clear(); render(); };
}
function offline(msg = 'No se pudieron cargar los datos.') {
  $('main').innerHTML = `<div class="empty"><b>Sin conexión</b>${msg}<br><button class="btn" id="retry">Reintentar</button></div>`;
  $('retry').onclick = () => { cache.clear(); render(); };
}
const skeleton = (n = 3, hero = false) => (hero ? '<div class="sk tall"></div>' : '') + '<div class="sk"></div>'.repeat(n);

// ---------- Componentes ----------
function hero(g, reasons = [], withBody = true) {
  const [l, r] = sides(g), [c1, c2] = teamColors(l, r);
  const hide = hidden(g);
  const live = g.state === 'in';
  const score = g.state === 'pre' || isPostponed(g) ? '<span style="font-size:30px">VS</span>'
    : hide ? '<span class="masked">· ·</span>' : `${l.score ?? ''}<i>–</i>${r.score ?? ''}`;
  const status = live ? `<span class="live-dot"></span>${esc(liveText(g))}` : hide && g.state === 'post' ? 'Final' : esc(statusText(g));
  const h = g.headline;
  const body = !withBody ? '' : hide ? `<div class="body"><h2>Resultado oculto</h2><p>Toca para verlo.</p></div>`
    : h ? `<div class="body"><h2>${esc(h.title)}</h2>${h.text ? `<p>${esc(h.text)}</p>` : ''}</div>` : '';
  return `<div class="hero" style="--c1:${c1};--c2:${c2}" data-game="${g.id}">
    <div class="meta-top"><span>${esc(leagueLabel(g))}</span><span>${esc(reasons.slice(0, 2).join(' · '))}</span></div>
    <div class="board">
      <div class="side"><div class="crest"><img src="${esc(l.logo)}" alt=""></div><b>${esc(l.name)}</b></div>
      <div class="score">${score}</div>
      <div class="side"><div class="crest"><img src="${esc(r.logo)}" alt=""></div><b>${esc(r.name)}</b></div>
    </div>
    <div class="status">${status}</div>${body}</div>`;
}

function scorebar(g) {
  const [l, r] = sides(g), hide = hidden(g), done = g.state === 'post' && !hide && g.result && g.result !== 'draw';
  const s = hide ? '<span class="masked">· ·</span>' : `${l.score ?? ''}<i>–</i>${r.score ?? ''}`;
  return `<div class="scorebar">
    <div class="t ${done && !isWinner(g, l) ? 'lost' : ''}"><img src="${esc(l.logo)}" alt=""><span>${esc(l.name)}</span></div>
    <div class="s">${s}</div>
    <div class="t r ${done && !isWinner(g, r) ? 'lost' : ''}"><span>${esc(r.name)}</span><img src="${esc(r.logo)}" alt=""></div></div>`;
}

function resultCard(x) {
  const g = x.game, hide = hidden(g), live = g.state === 'in';
  const el = document.createElement('div');
  el.className = 'card result';
  const chips = (x.reasons || []).map(r => `<span class="chip ${r.startsWith('Tu equipo') ? 'mine' : ''}">${esc(r)}</span>`).join('');
  const title = hide ? 'Resultado oculto' : live ? `${g.home.name} – ${g.away.name}` : g.headline?.title || `${g.home.name} – ${g.away.name}`;
  const text = hide ? 'Toca para verlo.' : live ? '' : g.headline?.text || '';
  el.innerHTML = `<div class="tags"><span class="tag">${live ? `<span class="live-dot"></span><span class="live-txt">${esc(liveText(g))}</span> · ` : ''}${esc(leagueLabel(g))}</span></div>
    ${chips ? `<div class="tags" style="margin-top:8px">${chips}</div>` : ''}
    <h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ''}${scorebar(g)}`;
  el.onclick = () => { if (hide) { revealed.add(g.id); el.replaceWith(resultCard(x)); } else openGame(g.id); };
  return el;
}

function upcomingCard(x) {
  const g = x.game, [l, r] = sides(g);
  const el = document.createElement('div');
  el.className = 'card mini';
  const chip = (x.reasons || [])[0];
  el.innerHTML = `<div class="when">${esc(dayWord(g.start_time))}, ${hhmm(g.start_time)}<small>${esc(leagueLabel(g))}</small></div>
    <div class="tm"><img src="${esc(l.logo)}" alt=""><span>${esc(l.name)}</span><small>${esc(l.record || '')}</small></div>
    <div class="tm"><img src="${esc(r.logo)}" alt=""><span>${esc(r.name)}</span><small>${esc(r.record || '')}</small></div>
    ${chip ? `<div><span class="chip ${chip.startsWith('Tu equipo') ? 'mine' : ''}">${esc(chip)}</span></div>` : ''}`;
  el.onclick = () => openGame(g.id);
  return el;
}

function section(title, aside = '') {
  return `<div class="section"><h3>${title}</h3>${aside ? `<span>${aside}</span>` : ''}</div>`;
}

// ---------- Inicio ----------
const RECENT_MS = 40 * 3600e3, UPCOMING_MS = 72 * 3600e3;
async function renderHome() {
  const id = ++reqId;
  const today = cap(new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }));
  $('header').innerHTML = `<div class="top"><div><div class="eyebrow">${today}${meta ? ' · ' + ago(meta.data_as_of) : ''}</div><h1>Destacados</h1></div>
    <div class="actions-top">${spoilerBtn()}<button class="pill" id="editBtn">Equipos</button></div></div>`;
  bindSpoiler();
  $('editBtn').onclick = () => go('picker');
  const main = $('main');
  main.innerHTML = skeleton(3, true);
  let featured, teamDocs;
  try {
    [featured, teamDocs] = await Promise.all([getJSON('featured.json'),
      Promise.all(favTeams.map(f => getJSON(`team/${f.key}.json`).catch(() => null)))]);
  } catch { featured = null; }
  if (id !== reqId) return;
  if (!featured) return offline();

  const now = Date.now(), mine = { live: [], results: [], upcoming: [] };
  for (const d of teamDocs || []) {
    if (!d) continue;
    const tag = `Tu equipo · ${d.team.name}`;
    if (d.live) mine.live.push({ game: d.live, reasons: [tag] });
    else if (d.last && now - new Date(d.last.start_time) < RECENT_MS) mine.results.push({ game: d.last, reasons: [tag] });
    if (d.next && new Date(d.next.start_time) - now < UPCOMING_MS) mine.upcoming.push({ game: d.next, reasons: [tag] });
  }
  const merge = (a, b) => {
    const byId = new Map(b.map(x => [x.game.id, x]));
    const seen = new Set(a.map(x => x.game.id));
    return [...a.map(x => byId.has(x.game.id) ? { ...x, reasons: [...x.reasons, ...byId.get(x.game.id).reasons] } : x),
            ...b.filter(x => !seen.has(x.game.id))];
  };
  const live = merge(mine.live, featured.live);
  const results = merge(mine.results, featured.results);
  const upcoming = merge(mine.upcoming, featured.upcoming).filter(x => new Date(x.game.start_time) > now - 3600e3)
    .sort((a, b) => a.game.start_time.localeCompare(b.game.start_time));

  main.innerHTML = '';
  // El partido estrella abre la portada: el mejor en juego o, si no hay, el mejor resultado
  const top = live[0] || results[0];
  if (top) {
    main.insertAdjacentHTML('beforeend', hero(top.game, top.reasons));
    const h = main.lastElementChild;
    h.onclick = () => { if (hidden(top.game)) { revealed.add(top.game.id); renderHome(); } else openGame(top.game.id); };
  }
  const restLive = live.filter(x => x !== top), restResults = results.filter(x => x !== top);
  if (restLive.length) { main.insertAdjacentHTML('beforeend', section('En juego')); restLive.forEach(x => main.appendChild(resultCard(x))); }
  if (upcoming.length) {
    main.insertAdjacentHTML('beforeend', section('Próximos', `${upcoming.length} partidos`) + '<div class="rail" id="rail"></div>');
    upcoming.forEach(x => $('rail').appendChild(upcomingCard(x)));
  }
  if (restResults.length) { main.insertAdjacentHTML('beforeend', section('Lo mejor de las últimas horas')); restResults.forEach(x => main.appendChild(resultCard(x))); }
  if (!top && !upcoming.length) main.innerHTML = `<div class="empty"><b>Sin partidos destacados</b>No hay grandes partidos estos días. Mira cada deporte abajo.</div>`;
}

// ---------- Ficha de partido ----------
async function renderGame(id) {
  const rid = ++reqId;
  $('header').innerHTML = `<div class="top"><button class="back" id="backBtn">${CHEV_L}Volver</button>${spoilerBtn()}</div>`;
  $('backBtn').onclick = () => history.length > 1 ? history.back() : go(view);
  bindSpoiler();
  const main = $('main');
  main.innerHTML = skeleton(2, true);
  let d;
  try { d = await getJSON(`game/${id}.json`); } catch { d = null; }
  if (rid !== reqId) return;
  if (!d) return offline('No se encontró este partido.');
  const g = d.game, pre = g.state === 'pre' || isPostponed(g);
  const [l, r] = sides(g), [c1, c2] = teamColors(l, r);
  const hide = hidden(g);

  const tabs = pre ? [['previa', 'Previa']] : [['resumen', 'Resumen'],
    ...(d.stats.length ? [['stats', 'Estadísticas']] : []),
    ...(d.lineups.length ? [['lineups', 'Alineaciones']] : d.players.length ? [['players', 'Jugadores']] : []),
    ['previa', 'Contexto']];
  if (!gameTab || !tabs.some(t => t[0] === gameTab)) gameTab = tabs[0][0];

  main.innerHTML = hero(g, [], !pre) +
    `<div class="tag" style="display:block;text-align:center;margin-top:10px">${esc(cap(shortDate(g.start_time)))} · ${hhmm(g.start_time)}${g.venue ? ' · ' + esc(g.venue) : ''}${g.broadcast ? ' · ' + esc(g.broadcast) : ''}</div>` +
    (tabs.length > 1 ? `<div class="seg" role="tablist">${tabs.map(([k, t]) => `<button role="tab" data-t="${k}" class="${k === gameTab ? 'sel' : ''}">${t}</button>`).join('')}</div>` : '') +
    `<div id="tabBody"></div><p class="source">Datos: ESPN · procesados por el pipeline de Marcador</p>`;
  main.querySelector('.hero').onclick = () => { if (hide) { revealed.add(g.id); renderGame(id); } };
  main.querySelector('.hero').style.cursor = hide ? 'pointer' : 'default';
  main.querySelectorAll('.seg button').forEach(b => b.onclick = () => { gameTab = b.dataset.t; renderGame(id); });

  const body = $('tabBody');
  if (hide && gameTab !== 'previa') { body.innerHTML = `<div class="card panel empty" style="padding:30px 16px">Toca el marcador para ver el resultado y las estadísticas.</div>`; return; }
  if (gameTab === 'resumen') body.innerHTML = summaryPanel(d, l, r, c1, c2);
  if (gameTab === 'stats') body.innerHTML = statsPanel(d, c1, c2);
  if (gameTab === 'players') body.innerHTML = playersPanel(d);
  if (gameTab === 'lineups') body.innerHTML = lineupPanel(d);
  if (gameTab === 'previa') body.innerHTML = contextPanel(d, l, r);
  body.querySelectorAll('[data-game]').forEach(e => e.onclick = () => openGame(e.dataset.game));
  body.querySelectorAll('[data-follow]').forEach(e => e.onclick = () => {
    toggleFollow(g.sport, [g.home, g.away].find(t => t.key === e.dataset.follow)); renderGame(id);
  });
}

function summaryPanel(d, l, r, c1, c2) {
  const g = d.game;
  let html = '';
  if (d.timeline.length) {
    html += `<div class="card panel"><h4>Cronología</h4><div class="timeline">${d.timeline.map(ev => {
      const left = ev.team_key === l.key;
      const ico = ev.kind === 'goal' ? BALL : `<span class="${ev.kind === 'red' ? 'card-r' : 'card-y'}"></span>`;
      const who = `<span><b>${esc(ev.player || '')}</b><small>${esc(ev.label)}</small></span>`;
      const cell = left ? `<div class="ev"><span class="ico">${ico}</span>${who}</div><div class="m">${esc(ev.minute)}</div><div></div>`
                        : `<div></div><div class="m">${esc(ev.minute)}</div><div class="ev r">${who}<span class="ico">${ico}</span></div>`;
      return `<div class="tl">${cell}</div>`; }).join('')}</div></div>`;
  }
  if (g.sport !== 'futbol' && l.linescores.length) {
    const reg = SPORTS[g.sport].reg, n = Math.max(l.linescores.length, r.linescores.length);
    const heads = Array.from({ length: n }, (_, i) => g.sport === 'mlb' ? i + 1 : i < reg ? i + 1 : `P${i - reg + 1}`);
    html += `<div class="card panel"><h4>${g.sport === 'mlb' ? 'Por entradas' : 'Por cuartos'}</h4><div class="scroll-x"><table class="box linescore">
      <tr><th></th>${heads.map(x => `<th>${x}</th>`).join('')}<th>T</th></tr>
      ${[l, r].map(t => `<tr><td>${esc(t.abbr)}</td>${t.linescores.map(v => `<td>${v}</td>`).join('')}<td><b>${t.score ?? ''}</b></td></tr>`).join('')}</table></div></div>`;
  }
  if (g.leaders?.length) {
    html += `<div class="card panel"><h4>Destacados</h4>${g.leaders.slice(0, 4).map(x => {
      const t = [g.home, g.away].find(t => t.key === x.team_key);
      return `<div class="vs" style="grid-template-columns:auto 1fr auto"><img src="${esc(t?.logo || '')}" alt="" style="width:22px;height:22px;object-fit:contain">
        <span><b>${esc(x.player)}</b></span><span class="tag">${esc(x.display)}${x.category === 'points' ? ' pts' : ''}</span></div>`; }).join('')}</div>`;
  }
  if (d.stats.length) html += statsPanel({ ...d, stats: d.stats.slice(0, 4) }, c1, c2, 'Lo esencial');
  return html || `<div class="card panel empty" style="padding:30px 16px">Sin más detalles de este partido.</div>`;
}

function statsPanel(d, c1, c2, title = 'Estadísticas') {
  const g = d.game, homeFirst = g.sport === 'futbol';
  return `<div class="card panel"><h4>${title}</h4>${d.stats.map(s => {
    const [lv, rv, ld, rd] = homeFirst ? [s.home_value, s.away_value, s.home, s.away] : [s.away_value, s.home_value, s.away, s.home];
    const bars = s.format === 'text' || lv == null || rv == null ? '' : (() => {
      const total = (lv + rv) || 1, lp = Math.round(lv / total * 100), rp = 100 - lp;
      return `<div class="bars"><div class="bar l"><i style="width:${lp}%;background:${c1}"></i></div><div class="bar"><i style="width:${rp}%;background:${c2}"></i></div></div>`;
    })();
    return `<div class="stat"><div class="lbl"><b>${esc(ld)}</b><span>${esc(s.label)}</span><b>${esc(rd)}</b></div>${bars}</div>`; }).join('')}</div>`;
}

function playersPanel(d) {
  const g = d.game;
  return d.players.map(tbl => `<div class="card panel"><h4>${esc(tbl.title)}</h4>${tbl.teams.map(t => {
    const team = [g.home, g.away].find(x => x.key === t.team_key);
    return `<div class="team-head"><img src="${esc(team.logo)}" alt="">${esc(team.name)}</div><div class="scroll-x"><table class="box">
      <tr><th></th>${tbl.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr>
      ${t.rows.map(p => `<tr><td>${esc(p.name)}<small>${esc(p.position || '')}</small></td>${p.values.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}
    </table></div>`; }).join('')}</div>`).join('');
}

function lineupPanel(d) {
  const g = d.game;
  return d.lineups.map(t => {
    const team = [g.home, g.away].find(x => x.key === t.team_key);
    const li = p => `<li><span class="jn">${esc(p.jersey || '')}</span><span>${esc(p.name)}${p.out ? ' <span class="sub-arrow">▾ sale</span>' : ''}${p.in ? ' <span class="sub-arrow">▴ entra</span>' : ''}</span><span class="ps">${esc(p.position || '')}</span></li>`;
    return `<div class="card panel"><div class="team-head"><img src="${esc(team.logo)}" alt="">${esc(team.name)}<small>${esc(t.formation || '')}</small></div>
      <h4 style="margin-top:12px">Titulares</h4><ul class="lineup">${t.starters.map(li).join('')}</ul>
      ${t.subs.length ? `<h4 style="margin-top:16px">Banquillo</h4><ul class="lineup">${t.subs.map(li).join('')}</ul>` : ''}</div>`;
  }).join('');
}

function formChips(last5) {
  if (!last5) return '<span class="tag">–</span>';
  return `<span class="form">${[...last5].map(o => `<i class="${o}">${OUTCOME_ES[o]}</i>`).join('')}</span>`;
}

function contextPanel(d, l, r) {
  const g = d.game, cl = d.context[l === g.home ? 'home' : 'away'], cr = d.context[r === g.home ? 'home' : 'away'];
  const pos = c => c.position ? `${c.position}º${c.standing_group ? ' · ' + esc(c.standing_group) : ''}` : '–';
  const rec = c => c.wins == null ? '–' : g.sport === 'futbol' ? `${c.wins}G ${c.draws}E ${c.losses}P` : `${c.wins}-${c.losses}`;
  const streak = c => c.streak_length >= 2 ? `${c.streak_length} ${c.streak === 'W' ? 'victorias' : c.streak === 'L' ? 'derrotas' : 'empates'}` : '–';
  const row = (label, a, b) => `<div class="vs"><span>${a}</span><span class="mid">${label}</span><span>${b}</span></div>`;
  let html = `<div class="card panel"><h4>Cara a cara</h4>
    <div class="vs" style="border-top:0"><span class="team-head" style="margin:0"><img src="${esc(l.logo)}" alt="">${esc(l.name)}</span><span></span><span class="team-head" style="margin:0;justify-content:flex-end">${esc(r.name)}<img src="${esc(r.logo)}" alt=""></span></div>
    ${row('Forma', formChips(cl.last_5), formChips(cr.last_5))}
    ${row('Clasificación', pos(cl), pos(cr))}
    ${row('Temporada', rec(cl), rec(cr))}
    ${g.sport === 'futbol' ? row('Puntos', cl.points ?? '–', cr.points ?? '–') : ''}
    ${row('Racha', streak(cl), streak(cr))}</div>`;
  if (d.meetings.length) {
    html += `<div class="card panel meetings"><h4>Esta temporada</h4>${d.meetings.map(m => `
      <div class="vs" data-game="${m.id}" style="cursor:pointer;grid-template-columns:auto 1fr auto 1fr"><span class="tag">${esc(shortDate(m.date))}</span>
        <span style="text-align:right">${esc(m.home)}</span><b class="num" style="font-size:17px;padding:0 8px">${spoilerFree ? '·' : `${m.home_score}–${m.away_score}`}</b><span>${esc(m.away)}</span></div>`).join('')}</div>`;
  }
  html += `<div class="card panel"><h4>Seguir</h4><div class="tags">${[l, r].map(t => `<button class="chip ${isFollowed(t.key) ? 'mine' : ''}" data-follow="${esc(t.key)}" style="font-size:13px;padding:7px 12px">${isFollowed(t.key) ? 'Siguiendo a ' : 'Seguir a '}${esc(t.name)}</button>`).join('')}</div></div>`;
  return html;
}

// ---------- Selector de equipos ----------
async function renderPicker() {
  const id = ++reqId;
  $('header').innerHTML = `<div class="top"><div><div class="eyebrow">Sus partidos saldrán primero en Destacados</div><h1>Tus equipos</h1></div><button class="pill on" id="doneBtn">Listo</button></div>
    <div class="tabs-seg" id="segSport">${['futbol', 'nba', 'nfl', 'mlb'].map(k => `<button data-k="${k}" class="${k === pickSport ? 'sel' : ''}">${SPORTS[k].label}</button>`).join('')}</div>
    ${pickSport === 'futbol' ? `<div class="tabs-seg" id="segLeague" style="margin-top:8px">${PICK_LEAGUES.map(([k, l]) => `<button data-k="${k}" class="${k === pickLeague ? 'sel' : ''}">${l}</button>`).join('')}</div>` : ''}
    <input class="search" id="search" placeholder="Buscar equipo" value="${esc(pickQuery)}" autocomplete="off">`;
  $('doneBtn').onclick = () => go('home');
  $('segSport').querySelectorAll('button').forEach(b => b.onclick = () => { pickSport = b.dataset.k; pickQuery = ''; renderPicker(); });
  $('segLeague')?.querySelectorAll('button').forEach(b => b.onclick = () => { pickLeague = b.dataset.k; renderPicker(); });
  $('search').oninput = ev => { pickQuery = ev.target.value; drawList(); };
  const main = $('main');
  main.innerHTML = skeleton(3);
  let all;
  try { all = await getJSON(`teams/${pickSport}.json`); } catch { all = null; }
  if (id !== reqId) return;
  if (!all) return offline('No se pudo cargar la lista de equipos.');
  drawList();
  function drawList() {
    const q = pickQuery.trim().toLowerCase();
    const teams = all.filter(t => q ? (t.full.toLowerCase().includes(q) || t.name.toLowerCase().includes(q)) : (pickSport !== 'futbol' || t.league_key === pickLeague));
    main.innerHTML = teams.length ? '<div class="card" id="pickList" style="margin-top:4px"></div>' : '<div class="empty">Ningún equipo coincide.</div>';
    for (const t of teams) {
      const row = document.createElement('div');
      row.className = 'pick';
      const draw = () => {
        const on = isFollowed(t.key);
        row.innerHTML = `<img src="${esc(t.logo)}" alt="" loading="lazy"><div class="nm">${esc(t.full)}</div><button class="${on ? 'on' : ''}">${on ? 'Siguiendo' : 'Seguir'}</button>`;
        row.querySelector('button').onclick = () => { toggleFollow(pickSport, t); draw(); };
      };
      draw();
      $('pickList').appendChild(row);
    }
  }
}

// ---------- Vista por deporte ----------
async function renderSport() {
  const sport = view, s = SPORTS[sport], id = ++reqId;
  let days;
  try { days = await getJSON(`days/${sport}/index.json`); } catch { days = null; }
  if (id !== reqId) return;
  if (!days) { drawSportHeader(sport, null, []); return offline(); }
  if (!days.length) { drawSportHeader(sport, null, days); $('main').innerHTML = `<div class="empty"><b>Sin partidos</b></div>`; return; }
  if (!current) { const pref = preferredDay(s); current = days.includes(pref) ? pref : ([...days].reverse().find(d => d <= pref) || days[0]); }
  drawSportHeader(sport, current, days);
  const main = $('main');
  if (main.dataset.key !== sport + current) main.innerHTML = skeleton(4);
  main.dataset.key = sport + current;
  let doc;
  try { doc = await getJSON(`days/${sport}/${current}.json`); } catch { doc = null; }
  if (id !== reqId) return;
  if (!doc) return offline();
  renderDay(doc);
}
function drawSportHeader(sport, day, days) {
  const s = SPORTS[sport], i = day ? days.indexOf(day) : -1;
  $('header').innerHTML = `<div class="top"><h1>${s.label}</h1>${spoilerBtn()}</div>` + (day ? `
    <div class="days"><button class="arrow" id="prev" aria-label="Día anterior con partidos" ${i <= 0 ? 'disabled' : ''}>${CHEV_L}</button>
    <div class="day-label"><b>${dayName(day, s)}</b><span>${longDate(day)}</span></div>
    <button class="arrow" id="next" aria-label="Día siguiente con partidos" ${i >= days.length - 1 ? 'disabled' : ''}>${CHEV_R}</button></div>` : '');
  bindSpoiler();
  if (!day) return;
  $('prev').onclick = () => { if (i > 0) { current = days[i - 1]; renderSport(); } };
  $('next').onclick = () => { if (i < days.length - 1) { current = days[i + 1]; renderSport(); } };
}
function renderDay(doc) {
  const main = $('main');
  main.innerHTML = '';
  const order = { in: 0, post: 1, pre: 2 };
  const sortFn = (a, b) => gameFollowed(b) - gameFollowed(a) || order[a.state] - order[b.state] || a.start_time.localeCompare(b.start_time);
  const all = doc.groups.flatMap(g => g.games);
  const mine = doc.groups.length > 1 ? all.filter(gameFollowed) : [];
  const groups = [...(mine.length ? [{ league: 'Tus equipos', games: mine }] : []),
    ...doc.groups.map(g => ({ ...g, games: g.games.filter(x => !mine.includes(x)) }))].filter(g => g.games.length);
  for (const grp of groups) {
    const card = document.createElement('div');
    card.className = 'card group';
    card.innerHTML = `<div class="group-title">${esc(grp.league)}</div>`;
    grp.games.sort(sortFn).forEach(g => card.appendChild(gameRow(g)));
    main.appendChild(card);
  }
}
function gameRow(g) {
  const [a, b] = sides(g), hide = hidden(g), done = g.state === 'post' && !hide && g.result && g.result !== 'draw';
  const el = document.createElement('div');
  el.className = 'row-game';
  const tm = t => `<div class="tm ${done && !isWinner(g, t) ? 'lost' : ''}"><img src="${esc(t.logo)}" alt="" loading="lazy"><span>${esc(t.name)}</span>
    ${t.record ? `<small>${esc(t.record)}</small>` : ''}${isFollowed(t.key) ? '<span class="followed">· Sigues</span>' : ''}
    <span class="sc">${g.state === 'pre' || isPostponed(g) ? '' : hide ? '<span class="masked">·</span>' : (t.score ?? '')}</span></div>`;
  let state;
  if (isPostponed(g)) state = '<b>Aplaz.</b>';
  else if (g.state === 'in') state = `<b class="live-txt">${hide ? 'Vivo' : esc(liveText(g))}</b>`;
  else if (g.state === 'post') state = `<b>Final</b>${hide ? '' : esc(extraTime(g).replace(' · ', ''))}`;
  else state = `<b>${hhmm(g.start_time)}</b>${esc(g.broadcast || '')}`;
  el.innerHTML = `<div class="teams">${tm(a)}${tm(b)}</div><div class="state">${state}</div>`;
  el.onclick = () => { if (hide) { revealed.add(g.id); el.replaceWith(gameRow(g)); } else openGame(g.id); };
  return el;
}

// ---------- F1 ----------
async function renderF1() {
  const id = ++reqId;
  $('header').innerHTML = `<div class="top"><h1>Fórmula 1</h1>${spoilerBtn()}</div>`;
  bindSpoiler();
  const main = $('main');
  main.innerHTML = skeleton(2);
  let data;
  try { data = await getJSON('f1.json'); } catch { data = null; }
  if (id !== reqId) return;
  if (!data) return offline();
  const gp = (gp, label) => {
    const race = gp.sessions.find(s => s.label === 'Carrera') || gp.sessions[gp.sessions.length - 1];
    const hide = spoilerFree && !revealed.has(gp.id);
    const range = `${new Date(gp.start).getDate()}–${new Date(gp.end).toLocaleDateString('es-ES', { day: 'numeric', month: 'long' })}`;
    let podium = '';
    if (race.state === 'post' && race.top3.length) podium = hide
      ? `<div class="podium"><button class="p" data-reveal="${gp.id}" style="justify-content:center;color:var(--muted)">Carrera terminada · toca para ver el podio</button></div>`
      : `<div class="podium">${race.top3.map(p => `<div class="p ${p.position === 1 ? 'first' : ''}"><span class="n">${p.position}</span><b>${esc(p.driver)}</b><small>${esc(p.country || '')}</small></div>`).join('')}</div>`;
    const sessions = gp.sessions.map(s => {
      const right = s.state === 'in' ? '<span class="live-txt"><span class="live-dot"></span>En directo</span>'
        : s.state === 'post' ? (hide ? 'Terminada' : esc(s.top3[0]?.driver || 'Terminada')) : `${shortDate(s.start)}, ${hhmm(s.start)}`;
      return `<div class="session"><span>${esc(s.label)}</span><span>${right}</span></div>`;
    }).join('');
    return `<div class="card gp"><div class="tag">${label}</div><h2>${esc(gp.name)}</h2><div class="sub">${range}${gp.circuit ? ' · ' + esc(gp.circuit) : ''}</div>${podium}${sessions}</div>`;
  };
  main.innerHTML = (data.next ? gp(data.next, 'Próximo Gran Premio') : '') + (data.current ? gp(data.current, 'Último Gran Premio') : '')
    || `<div class="empty"><b>Sin Gran Premio</b>No hay carreras a la vista.</div>`;
  main.querySelectorAll('[data-reveal]').forEach(e => e.onclick = () => { revealed.add(e.dataset.reveal); renderF1(); });
}

// ---------- Gestos y arranque ----------
let tx = null, ty = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (tx === null || location.hash || !SPORTS[view] || SPORTS[view].f1) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5 && !e.target.closest('.scroll-x, .rail')) $(dx > 0 ? 'prev' : 'next')?.click();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && view !== 'picker') { cache.clear(); render(); } });

drawTabs();
getJSON('meta.json').then(m => { meta = m; if (view === 'home' && !location.hash) renderHome(); }).catch(() => {});
render();
</script>
</body>
</html>
